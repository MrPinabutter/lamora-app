services:
  db:
    image: postgres:16-alpine
    container_name: lamora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lamora
      POSTGRES_PASSWORD: lamora
      POSTGRES_DB: lamora
    ports:
      - "5433:5432"
    volumes:
      - lamora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamora -d lamora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lamora-db-data:
